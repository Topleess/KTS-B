[project]
name = "cosmeto-backend"
version = "0.1.0"
description = "FastAPI backend for Cosmeto / KTS Beauty"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.17.2",
  "asyncpg>=0.31.0",
  "boto3>=1.42.0",
  "fastapi[standard]>=0.124.0",
  "httpx>=0.28.1",
  "openai>=2.9.0",
  "pydantic-settings>=2.12.0",
  "python-jose[cryptography]>=3.5.0",
  "redis>=7.1.0",
  "sqlalchemy[asyncio]>=2.0.44",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
