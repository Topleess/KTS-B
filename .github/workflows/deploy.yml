name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cosmetos-production
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_APP_URL: https://kts.as-shamshurin.xyz
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: cosmetos46_bot
      API_PROXY_TARGET: http://127.0.0.1:8000
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e "backend[test]"

      - name: Test backend
        run: cd backend && pytest

      - name: Prepare Compose env
        run: cp .env.example.server .env

      - name: Validate Compose
        run: docker compose config --quiet

  deploy:
    name: Deploy
    needs: checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          APP_DIR="${DEPLOY_PATH:-/opt/apps/cosmetos}"
          DOMAIN="${DEPLOY_DOMAIN:-kts.as-shamshurin.xyz}"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' DOMAIN='$DOMAIN' BRANCH='main' bash '$APP_DIR/scripts/deploy.sh'"
