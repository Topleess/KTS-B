services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cosmeto
      POSTGRES_USER: cosmeto
      POSTGRES_PASSWORD: cosmeto
    ports:
      - "5432:5432"
    volumes:
      - cosmeto_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmeto -d cosmeto"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cosmeto_postgres:
